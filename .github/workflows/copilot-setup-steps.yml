name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/dev-setup.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/dev-setup.sh

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: false

      - name: Run shared dev-setup script
        run: |
          chmod +x scripts/dev-setup.sh
          sudo ./scripts/dev-setup.sh --parallel-dbs

      - name: Verify setup
        run: |
          # Verify PostgreSQL version and connection
          psql -U postgres -c "SELECT version();"
          bundle exec rails runner "ActiveRecord::Base.connection.execute('SELECT 1')"

          # Verify PostGIS extension
          bundle exec rails runner "puts ActiveRecord::Base.connection.execute('SELECT PostGIS_version()').first['postgis_version']" || echo "PostGIS check skipped"

          # Verify Redis connection
          bundle exec rails runner "Rails.cache.write('test', 'ok'); puts Rails.cache.read('test')"

          # Verify RuboCop is available
          bundle exec rubocop --version

          # Verify RSpec is available
          bundle exec rspec --version

      - name: Environment summary
        run: |
          echo "=== Environment Summary ==="
          echo "Ruby version: $(ruby --version)"
          echo "Bundler version: $(bundle --version)"
          echo "PostgreSQL version: $(psql --version)"
          echo "Redis version: $(redis-server --version)"
          echo "=== Available Commands ==="
          echo "Tests: bundle exec rspec spec/ OR bundle exec parallel_test spec modules -n 8"
          echo "Linting: bundle exec rubocop"
          echo "Console: bundle exec rails console"
          echo "Server: bundle exec rails server -b 0.0.0.0"
